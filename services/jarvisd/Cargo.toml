[package]
name = "jarvisd"
version = "0.1.0"
edition = "2021"
description = "JarvisOS bus broker + jv debug CLI"
license = "MIT"

[[bin]]
name = "jarvisd"
path = "src/bin/jarvisd.rs"

[[bin]]
name = "jv"
path = "src/bin/jv.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rmp-serde = "1"
rmpv = { version = "1", features = ["with-serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "io-util",
  "sync",
  "time",
  "signal",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
