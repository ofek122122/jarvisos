[project]
name = "jv-voice"
version = "0.1.0"
description = "JarvisOS voice: speech.say -> Piper + signature chain -> speakers, publishing speech.state"
requires-python = ">=3.10"
dependencies = [
  "jarvis-bus",
  "numpy",
  "scipy",
  "soundfile",
  "piper-tts>=1.3",
  "tomli; python_version < '3.11'",
]

[project.optional-dependencies]
play = ["sounddevice"]

[project.scripts]
jv-voice = "jv_voice.main:cli"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jv_voice*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
