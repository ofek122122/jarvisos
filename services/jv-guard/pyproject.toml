[project]
name = "jv-guard"
version = "0.1.0"
description = "JarvisOS guard: screens every Windows binary before jv-compat will touch it"
requires-python = ">=3.10"
dependencies = [
  "jarvis-bus",
  "httpx>=0.27",
]

[project.scripts]
jv-guard = "jv_guard.main:cli"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jv_guard*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
