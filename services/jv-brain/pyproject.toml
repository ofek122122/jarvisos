[project]
name = "jv-brain"
version = "0.1.0"
description = "JarvisOS brain v0: conversation only — transcripts in, spoken replies out"
requires-python = ">=3.10"
dependencies = [
  "jarvis-bus",
  "httpx>=0.27",
]

[project.scripts]
jv-brain = "jv_brain.main:cli"
jv-llm-launch = "jv_brain.launcher:cli"
jv-onboard = "jv_brain.main:onboard_cli"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jv_brain*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
