# BRIEF-phase0 task 5: nix flake check on every commit.
# CI has no GPU and no disks, so it verifies what it can: the flake
# evaluates, and the full ares system instantiates to a derivation.
name: flake check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: nix flake check (evaluation)
        run: nix flake check --no-build

      - name: instantiate the ares system
        run: nix eval --raw .#nixosConfigurations.ares.config.system.build.toplevel.drvPath

  bindings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: schema bindings drift gate
        run: python3 tools/gen_bindings.py --check

  jarvisd:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/jarvisd
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/jarvisd
      - name: tests (unix socket path)
        run: cargo test --locked
      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  python:
    runs-on: ubuntu-latest
    env:
      JARVIS_MODELS_DIR: ${{ github.workspace }}/models-cache
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/jarvisd
      - name: build jarvisd (pylib integration tests run against it)
        run: cargo build --locked
        working-directory: services/jarvisd
      - uses: actions/setup-python@v5
        with:
          # 3.11, not newer: openwakeword hard-depends on tflite-runtime
          # on Linux (unused by us — we run its ONNX path) and tflite
          # wheels stop at 3.11.
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: models-cache
          key: models-earsvoice-v1-${{ hashFiles('models/fetch.sh') }}
      - name: fetch ears+voice models (pinned SHA256)
        run: ./models/fetch.sh --only ears,voice
      - name: install packages
        run: |
          python -m pip install -q pytest pytest-asyncio
          python -m pip install -q -e services/pylib -e services/jv-ears -e services/jv-voice -e services/jv-brain -e services/jv-context
      - name: pylib tests (client vs real jarvisd)
        run: python -m pytest tests -q
        working-directory: services/pylib
      - name: jv-ears tests (fixtures, real models, no mic)
        run: python -m pytest tests -q
        working-directory: services/jv-ears
      - name: jv-voice tests (real piper, fake player)
        run: python -m pytest tests -q
        working-directory: services/jv-voice
      - name: jv-context tests (mock compositor, stub probes)
        run: python -m pytest tests -q
        working-directory: services/jv-context
      - name: jv-brain tests (stub LLM, mocked VRAM probe)
        run: python -m pytest tests -q
        working-directory: services/jv-brain
      - name: harness tests (record/replay roundtrip)
        run: python -m pytest tests -q
        working-directory: harness
